name: CI
on:
  push:
    branches: [master, nix]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Nix Flake Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check

      - name: Check AI policy and config ownership
        run: |
          bash tests/policy-eval.sh
          python=$(nix eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.); in f.inputs.nixpkgs.legacyPackages.aarch64-darwin.python3.interpreter')
          nix build --no-link --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.aarch64-darwin.python3'
          GOOSE_TEST_PYTHON="$python" "$python" tests/goose_config_activation_test.py
          bash tests/hm-goose-transition.sh

      - name: Build all darwin configurations
        run: |
          for config in $(nix eval --json '.#darwinConfigurations' --apply 'builtins.attrNames' | jq -r '.[]'); do
            echo "Building $config..."
            nix build ".#darwinConfigurations.$config.system"
          done
